[providers]
providers = ['php', 'node']

[phases.setup]
nixPkgs = [
    'php83',
    'php83Extensions.intl',
    'php83Extensions.zip',
    'php83Extensions.pdo_mysql',
    'php83Extensions.bcmath',
    'composer',
    'nodejs_20'
]

[phases.build]
cmds = [
    'composer install --ignore-platform-reqs --no-dev --optimize-autoloader',
    'npm install',
    'npm run build'
]